name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-lock.txt
      - run: python scripts/check_public_files.py
      - name: Install pinned sing-box for integration tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/sing-box
          gh release download v1.14.2 --repo SagerNet/sing-box --pattern 'sing-box-1.14.2-linux-amd64.tar.gz' --dir /tmp/sing-box
          cd /tmp/sing-box
          echo 'a684484d7477d1437282ee411f4d131d0340aaad60a7868841ebd5d87dd8a0c6  sing-box-1.14.2-linux-amd64.tar.gz' | sha256sum --check
          tar -xzf sing-box-1.14.2-linux-amd64.tar.gz
      - name: Run regression and real node configuration tests
        env:
          TMD_SINGBOX_BINARY: /tmp/sing-box/sing-box-1.14.2-linux-amd64/sing-box
        run: python -m unittest discover -s tests -t .
      - run: python -m py_compile media_downloader.py module/*.py utils/*.py scripts/*.py
      - run: git diff --check
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan files and history with Gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern '*linux_x64.tar.gz' --pattern '*checksums.txt' --dir /tmp/gitleaks-release
          cd /tmp/gitleaks-release
          sha256sum --ignore-missing --check *checksums.txt
          tar -xzf *linux_x64.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          /tmp/gitleaks-release/gitleaks dir . --redact=100
          /tmp/gitleaks-release/gitleaks git . --redact=100
